name: hapto-mobile

on:
  pull_request:
    paths:
      - 'apps/hapto-mobile/**'
  push:
    branches: [main]
    paths:
      - 'apps/hapto-mobile/**'

defaults:
  run:
    working-directory: apps/hapto-mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/hapto-mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
