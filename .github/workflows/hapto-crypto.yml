name: hapto-crypto

on:
  pull_request:
    paths:
      - 'services/hapto-crypto/**'
      - 'proto/**'
  push:
    branches: [main]
    paths:
      - 'services/hapto-crypto/**'
      - 'proto/**'

defaults:
  run:
    working-directory: services/hapto-crypto

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/hapto-crypto

      - name: cargo fmt check
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
