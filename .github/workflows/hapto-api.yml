name: hapto-api

on:
  pull_request:
    paths:
      - 'services/hapto-api/**'
      - 'proto/**'
  push:
    branches: [main]
    paths:
      - 'services/hapto-api/**'
      - 'proto/**'

defaults:
  run:
    working-directory: services/hapto-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: hapto
          POSTGRES_PASSWORD: hapto
          POSTGRES_DB: hapto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hapto -d hapto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.0-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: services/hapto-api/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/hapto-api
          version: v2.6.0

      - name: run migrations
        run: go run ./cmd/migrate up
        env:
          DATABASE_URL: postgres://hapto:hapto@localhost:5432/hapto?sslmode=disable

      - name: go test
        run: go test -race ./...
        env:
          DATABASE_URL: postgres://hapto:hapto@localhost:5432/hapto?sslmode=disable
          REDIS_URL: redis://localhost:6379/0

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
