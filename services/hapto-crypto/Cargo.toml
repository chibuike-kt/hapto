[package]
name = "hapto-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[build-dependencies]
tonic-prost-build = "0.14"
